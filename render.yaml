# Blueprint de Render: New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: reto01-registro-proveedor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: MAX_ITERACIONES
        value: "25"
      - key: MAX_TOKENS_SESION
        value: "150000"
      # Secretos: Render los pide al crear el servicio; nunca se guardan en el repositorio.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_KEY
        sync: false
