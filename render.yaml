# Blueprint de Render: New → Blueprint → seleccionar este repositorio.
# Sin claves de LLM, el agente responde en modo determinista. Para activar un modelo, agrega en
# Environment UNA de: ANTHROPIC_API_KEY, OPENAI_API_KEY o GEMINI_API_KEY (no hay que tocar código).
services:
  - type: web
    name: reto01-registro-proveedor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # auto = el primer proveedor con clave (anthropic → openai → gemini); sin clave, determinista.
      - key: LLM_PROVIDER
        value: auto
      - key: MAX_ITERACIONES
        value: "25"
      - key: MAX_TOKENS_SESION
        value: "150000"
      # Secreto: clave del link. Nunca se guarda en el repositorio.
      - key: ACCESS_KEY
        sync: false
